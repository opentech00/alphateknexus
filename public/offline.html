<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Offline — AlphaTek Nexus</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, system-ui, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        padding: 24px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 16px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #94a3b8; margin: 0 0 20px; line-height: 1.5; }
      button {
        background: #059669;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/apple-touch-icon.png" alt="AlphaTek" />
      <h1>You're offline</h1>
      <p>AlphaTek Nexus needs a connection to load this page. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>

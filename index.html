    <script>
      (function(){try{var s=localStorage.getItem('atn-theme-prefs');var p=s?JSON.parse(s):{};var t=p.theme||'light';var a=p.accent_color||'emerald';var rm=p.reduced_motion||false;var cm=p.compact_mode||false;var r=document.documentElement;r.classList.remove('dark','black','system','light');var resolved=t;if(t==='system'){resolved=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}r.classList.add(resolved);if(t!==resolved)r.classList.add(t);if(resolved==='black')r.classList.add('dark');r.setAttribute('data-accent',a);if(rm)r.classList.add('reduced-motion');if(cm)r.classList.add('compact-mode');r.style.colorScheme=resolved==='light'?'light':'dark';}catch(e){}})();
    </script>
    <script>
      (function(){
        var h = window.location.hostname.split('.');
        var sub = h.length > 2 ? h[0] : '';
        var map = { 'admin': '/admin.html', 'employee': '/employee.html', 'field': '/field.html' };
        if (map[sub] && window.location.pathname !== map[sub]) {
          window.location.replace(map[sub]);
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        function fail() {
          var r = document.getElementById('root');
          if (!r || r.getAttribute('data-booted') || r.childNodes.length) return;
          r.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;background:#f5f8ff;color:#0f172a;text-align:center"><div><p style="font-weight:700;margin:0 0 8px">AlphaTek Nexus could not load</p><p style="color:#64748b;font-size:14px;margin:0 0 16px">Check your connection and try again.</p><button onclick="location.reload()" style="background:#059669;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:600">Reload</button></div></div>';
        }
        window.addEventListener('error', fail);
        window.addEventListener('unhandledrejection', fail);
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && !r.getAttribute('data-booted') && !r.childNodes.length) fail();
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
